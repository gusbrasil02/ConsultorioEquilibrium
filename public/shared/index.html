<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consultório — Tela do Paciente</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&family=DM+Sans:wght@300;400;500&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
  }
}
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100vh; overflow:hidden;
  font-family:'DM Sans', sans-serif;
  color:#fff;
  transition: background 1s ease;
}

body.bg-default  { background: #0c0c14; }

/* ── Estado Idle ── */
#idle-screen {
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:10;
  transition: opacity 0.8s;
}
#idle-screen.hidden { opacity:0; pointer-events:none; }

.idle-glow {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%);
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(80,50,150,0.15) 0%, transparent 70%);
  border-radius:50%;
  animation:glow-pulse 4s ease-in-out infinite;
}
@keyframes glow-pulse {
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6;}
  50%{transform:translate(-50%,-50%) scale(1.15);opacity:1;}
}

.idle-particles { position:absolute; inset:0; pointer-events:none; }
.idle-particle {
  position:absolute; border-radius:50%;
  background:rgba(180,140,255,0.5);
  animation:float var(--dur) ease-in-out infinite;
}
@keyframes float {
  0%,100%{transform:translateY(0) scale(1);opacity:0.3;}
  50%{transform:translateY(-40px) scale(1.2);opacity:0.8;}
}

.idle-clinic {
  position:relative;
  font-family:'Playfair Display', serif;
  font-size:clamp(2.5rem, 5vw, 4rem);
  font-weight:300;
  letter-spacing:0.06em;
  color:rgba(255,255,255,0.8);
  margin-bottom:1rem;
  text-align:center;
}
.idle-welcome {
  font-size:clamp(1rem, 2vw, 1.4rem);
  color:rgba(255,255,255,0.35);
  letter-spacing:0.12em;
  text-transform:uppercase;
}

/* ── Estado Ativo: Anatomia 3D (fisioterapia) ── */
#active-screen {
  position:fixed; inset:0;
  display:grid; grid-template-columns: 1fr minmax(380px, 33vw);
  opacity:0; pointer-events:none;
  transition:opacity 0.8s;
  z-index:10;
  background:#03060b;
}
#active-screen.visible { opacity:1; pointer-events:all; }

.anatomy-col { position:relative; min-width:0; }
#phy-canvas-shared { position:absolute; inset:0; }

/* Coluna direita — explicação */
.explanation-col {
  display:flex; flex-direction:column; justify-content:center;
  padding:2.8rem 2.4rem 3.8rem;
  border-left:1px solid rgba(120,220,255,0.08);
  background:linear-gradient(180deg, rgba(10,24,36,0.75), rgba(3,6,11,0.95));
  overflow:hidden;
}
.explanation-header {
  font-size:clamp(0.65rem, 0.9vw, 0.78rem);
  text-transform:uppercase; letter-spacing:0.22em;
  color:rgba(140,225,255,0.55);
  margin-bottom:1rem;
}
.expl-region {
  display:inline-flex; align-items:center; gap:0.5rem; align-self:flex-start;
  padding:0.3rem 0.85rem; border-radius:60px; margin-bottom:1rem;
  font-size:clamp(0.75rem, 1vw, 0.9rem); letter-spacing:0.08em; text-transform:uppercase;
  color:#ffd2cd; background:rgba(255,60,50,0.12); border:1px solid rgba(255,110,100,0.45);
}
.expl-region::before { content:''; width:8px; height:8px; border-radius:50%; background:#ff4a3d; box-shadow:0 0 10px #ff4a3d;
  animation: explBlink 1.2s ease-in-out infinite; }
@keyframes explBlink { 50% { opacity:0.35; } }
.explanation-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(1.7rem, 2.8vw, 2.5rem);
  font-weight:300;
  color:rgba(255,255,255,0.93);
  margin-bottom:1.2rem;
  line-height:1.2;
}
.explanation-text {
  font-size:clamp(1rem, 1.35vw, 1.2rem);
  line-height:1.75;
  color:rgba(255,255,255,0.74);
  white-space:pre-line;
}
.expl-block {
  margin-top:1.4rem; padding:1rem 1.2rem; border-radius:14px;
  background:rgba(60,190,255,0.06); border:1px solid rgba(120,220,255,0.16);
  opacity:0; transform:translateY(10px); transition:opacity 0.8s, transform 0.8s;
}
.expl-block.on { opacity:1; transform:none; }
.expl-block-t { font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:rgba(140,225,255,0.7); margin-bottom:0.45rem; }
.expl-block div:last-child { font-size:clamp(0.95rem, 1.2vw, 1.1rem); line-height:1.65; color:rgba(230,245,255,0.8); }
.expl-tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:1.2rem; }
.expl-tag {
  display:inline-flex; align-items:center; gap:0.4rem; padding:0.28rem 0.8rem; border-radius:60px; font-size:0.85rem;
  background:rgba(255,60,50,0.1); border:1px solid rgba(255,110,100,0.4); color:#ffd9d5;
  animation: fadeInUp 0.45s ease both;
}
.expl-tag i { width:7px; height:7px; border-radius:50%; background:#ff4a3d; display:inline-block; }

/* Rodapé */
.shared-footer {
  position:fixed; bottom:0; left:0; right:0;
  display:flex; justify-content:space-between;
  padding:0.8rem 2rem;
  border-top:1px solid rgba(255,255,255,0.04);
  font-size:0.75rem;
  color:rgba(255,255,255,0.2);
  z-index:20;
  letter-spacing:0.05em;
}

/* ── Tela Acupuntura 3D ── */
#acu-screen {
  position:fixed; inset:0;
  display:none; grid-template-columns: 1fr minmax(340px, 30vw);
  z-index:10;
  background: #05050a;
}
#acu-screen.visible { display:grid; }
#acu-canvas-shared { width:100%; height:100%; position:relative; }

.acu-info-col {
  display:flex; flex-direction:column;
  padding:2.6rem 2.2rem 3.5rem;
  border-left:1px solid rgba(255,255,255,0.05);
  background:linear-gradient(180deg, rgba(20,18,40,0.6), rgba(5,5,10,0.9));
  overflow:hidden;
}
.acu-info-label {
  font-size:0.72rem; text-transform:uppercase; letter-spacing:0.2em;
  color:rgba(160,230,210,0.55); margin-bottom:0.9rem;
}
.acu-info-title {
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(1.6rem, 2.6vw, 2.3rem); font-weight:300;
  color:rgba(255,255,255,0.92); line-height:1.2;
}
.acu-info-sub { margin-top:0.5rem; font-size:0.95rem; color:rgba(255,255,255,0.5); line-height:1.5; }
.acu-mer-tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:1rem; }
.acu-mer-tag {
  display:inline-flex; align-items:center; gap:0.4rem;
  padding:0.25rem 0.75rem; border-radius:60px; font-size:0.82rem;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.78);
}
.acu-mer-tag i { width:8px; height:8px; border-radius:50%; display:inline-block; }
.acu-sep { height:1px; background:linear-gradient(90deg,rgba(120,200,180,0.3),transparent); margin:1.3rem 0; flex-shrink:0; }
.acu-pts-list { display:flex; flex-direction:column; gap:0.6rem; overflow-y:auto; flex:1; padding-right:0.3rem; }
.acu-pts-list::-webkit-scrollbar { width:0; }
.acu-pt-item {
  display:flex; align-items:flex-start; gap:0.75rem;
  padding:0.75rem 0.95rem;
  background:rgba(255,255,255,0.035);
  border:1px solid rgba(255,255,255,0.07);
  border-left:3px solid var(--c, #fff);
  border-radius:12px;
  animation: fadeInUp 0.45s ease both;
}
@keyframes fadeInUp { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
.acu-pt-texts { display:flex; flex-direction:column; gap:0.18rem; min-width:0; }
.acu-pt-top { display:flex; gap:0.55rem; align-items:baseline; flex-wrap:wrap; }
.acu-pt-code { font-size:1rem; font-weight:600; color:#fff; }
.acu-pt-pinyin { font-size:0.95rem; color:rgba(255,255,255,0.75); }
.acu-pt-side { font-size:0.72rem; color:rgba(255,255,255,0.4); }
.acu-pt-name-pt { font-size:0.85rem; color:rgba(255,255,255,0.45); font-style:italic; }
.acu-pt-ind { font-size:0.85rem; color:rgba(255,255,255,0.62); line-height:1.45; margin-top:0.15rem; }
</style>
</head>
<body class="bg-default">

<!-- Idle -->
<div id="idle-screen">
  <div class="idle-glow"></div>
  <div class="idle-particles" id="idle-particles"></div>
  <div class="idle-clinic">Consultório de Fisioterapia</div>
  <div class="idle-welcome">Bem-vindo à sua sessão</div>
</div>

<!-- Ativo -->
<div id="active-screen">
  <div class="anatomy-col">
    <div id="phy-canvas-shared"></div>
  </div>
  <div class="explanation-col">
    <div class="explanation-header">Fisioterapia · o que está acontecendo</div>
    <div class="expl-region" id="expl-region"></div>
    <div class="explanation-title" id="expl-title"></div>
    <div class="explanation-text" id="expl-text"></div>
    <div class="expl-block" id="expl-treat">
      <div class="expl-block-t" id="expl-treat-t">Como o tratamento ajuda</div>
      <div id="expl-treat-text"></div>
    </div>
    <div class="expl-tags" id="expl-tags"></div>
  </div>
</div>

<!-- ── Tela Acupuntura 3D ── -->
<div id="acu-screen">
  <div id="acu-canvas-shared"></div>
  <div class="acu-info-col">
    <div class="acu-info-label">Acupuntura · pontos desta sessão</div>
    <div class="acu-info-title" id="acu-info-title">Aguardando pontos...</div>
    <div class="acu-info-sub" id="acu-info-sub"></div>
    <div class="acu-mer-tags" id="acu-mer-tags"></div>
    <div class="acu-sep"></div>
    <div class="acu-pts-list" id="acu-pts-list"></div>
  </div>
</div>

<div class="shared-footer">
  <span>Consultório de Fisioterapia &amp; Acupuntura</span>
  <span id="footer-clock"></span>
</div>

<script>
// ── Estado ──────────────────────────────────────────────────────────────────
// A TV acompanha a sessão EM ANDAMENTO (ou a do paciente recém-chamado) e mostra
// o último conteúdo publicado nela. Sem sessão → tela de repouso. Nunca fica
// exibindo o conteúdo de um paciente anterior.

let sessionId = null
let lastEventId = null
let typewriterTimer = null

// ── Partículas idle ─────────────────────────────────────────────────────────

;(function buildIdleParticles() {
  const cont = document.getElementById('idle-particles')
  for (let i = 0; i < 35; i++) {
    const p = document.createElement('div')
    p.className = 'idle-particle'
    const sz = Math.random() * 5 + 2
    p.style.cssText = `
      width:${sz}px;height:${sz}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --dur:${(Math.random()*5+3).toFixed(1)}s;
      animation-delay:${(Math.random()*6).toFixed(1)}s;
    `
    cont.appendChild(p)
  }
})()

// Relógio discreto no rodapé
function tickClock() {
  const el = document.getElementById('footer-clock')
  if (el) el.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
}
tickClock()
setInterval(tickClock, 30000)

// ── Typewriter ───────────────────────────────────────────────────────────────

function typewriterEffect(text, el, delay = 28, onDone = null) {
  if (typewriterTimer) clearInterval(typewriterTimer)
  el.textContent = ''
  let i = 0
  typewriterTimer = setInterval(() => {
    if (i < text.length) {
      el.textContent += text[i]
      i++
    } else {
      clearInterval(typewriterTimer)
      onDone?.()
    }
  }, delay)
}

// ── Estados de tela ──────────────────────────────────────────────────────────

function showIdle() {
  if (typewriterTimer) clearInterval(typewriterTimer)
  // O próximo conteúdo recomeça do corpo inteiro
  if (phySharedViewer) { phySharedViewer.destroy(); phySharedViewer = null }
  document.body.className = 'bg-default'
  document.getElementById('active-screen').classList.remove('visible')
  document.getElementById('acu-screen').classList.remove('visible')
  document.getElementById('idle-screen').classList.remove('hidden')
}

// Aplica o estado vindo do servidor: { session_id, anatomy }
function applyTvState(st) {
  const sid = st?.session_id || null
  if (sid !== sessionId) {
    // Paciente mudou (ou atendimento acabou): limpa a tela na hora
    sessionId = sid
    lastEventId = null
    showIdle()
  }
  const ev = st?.anatomy
  if (!sid || !ev) return
  if (ev.id !== lastEventId) {
    lastEventId = ev.id
    showActiveState(ev)
  }
}

// ── Tempo real: SSE com fallback para polling ───────────────────────────────

let sharedES = null, sharedSSEok = false, fallbackTimer = null

function startSharedStream() {
  if (!window.EventSource) { startSharedPolling(); return }
  try {
    sharedES = new EventSource('/api/stream/public')
    sharedES.onopen = () => {
      sharedSSEok = true
      if (fallbackTimer) { clearInterval(fallbackTimer); fallbackTimer = null }
    }
    sharedES.onmessage = (e) => {
      let d; try { d = JSON.parse(e.data) } catch (_) { return }
      if (d.type === 'public') applyTvState(d.shared)
    }
    sharedES.onerror = () => { if (!sharedSSEok) startSharedPolling() }
  } catch (_) { startSharedPolling() }
}

function startSharedPolling() {
  if (fallbackTimer) return
  const poll = async () => {
    try {
      const r = await fetch('/api/tv/state')
      if (r.ok) applyTvState(await r.json())
    } catch (_) {}
  }
  poll()
  fallbackTimer = setInterval(poll, 2500)
}

function showActiveState(event) {
  // Evento de acupuntura → modo 3D
  if (event.region === '__acupuncture__') {
    showAcupunctureState(event)
    return
  }
  // A profissional limpou a TV
  if (event.region === '__clear__') { showIdle(); return }

  // Esconde a tela de acupuntura se estava ativa
  document.getElementById('acu-screen').classList.remove('visible')
  showPhysioState(event)
}

// ── Anatomia 3D (fisioterapia) ────────────────────────────────────────────────
// Sequência automática: corpo inteiro → aproxima na região acesa em vermelho →
// visão interna (holograma) com a lesão, quando a profissional enviou assim.

let phySharedViewer = null
let pendingPhy = null

function showPhysioState(event) {
  document.body.className = 'bg-default'
  document.getElementById('idle-screen').classList.add('hidden')
  document.getElementById('active-screen').classList.add('visible')

  if (!window.PHY) {                     // módulo 3D ainda carregando
    pendingPhy = event
    setTimeout(() => { if (pendingPhy === event) showPhysioState(event) }, 300)
    return
  }
  pendingPhy = null

  // Cena enviada pelo painel; eventos antigos têm só o nome da região
  let v = null
  try { v = JSON.parse(event.problem || '').view3d || null } catch (_) {}
  const region = (v && PHY.findRegion(v.region)) || PHY.regionByLabel(event.region)
  const cond = region && v?.condition ? PHY.findCondition(region, v.condition) : null
  const model = v?.model === 'male' ? 'male' : 'female'

  if (phySharedViewer && phySharedViewer.getModel() !== model) { phySharedViewer.destroy(); phySharedViewer = null }
  if (!phySharedViewer) {
    phySharedViewer = new PHY.PhysioViewer(document.getElementById('phy-canvas-shared'), {
      tv: true, model,
      onParts: parts => renderPhyTags(parts)
    })
  }
  const skin = v?.skin === 'muscle' ? 'muscle' : 'skin'
  const muscles = skin === 'muscle' ? (v?.muscles || []) : []
  phySharedViewer._tvFx = cond?.fx || []
  phySharedViewer._tvMarks = v?.marks || []
  // Músculos em destaque: os escolhidos + os ligados à condição
  phySharedViewer._tvMuscles = [...new Set([...muscles.map(x => x.split(':')[0]), ...(skin === 'muscle' ? cond?.muscles || [] : [])])]
  phySharedViewer.play({
    region: region?.id || null, condition: cond?.id || null, marks: v?.marks || [], internal: !!v?.internal,
    skin, muscles, isolate: !!v?.isolate
  })

  // Só músculos (sem condição): a ficha do músculo
  const mus = !cond && muscles.length ? PHY.findMuscle(muscles[0].split(':')[0]) : null
  const lado = mus ? ({ D: ' direito', E: ' esquerdo' }[muscles[0].split(':')[1]] || '') : ''
  document.getElementById('expl-region').textContent = region?.label || (mus ? 'Músculo' + lado : event.region)
  document.getElementById('expl-title').textContent = cond?.name || (mus ? mus.name : region?.label || event.region)
  const treat = document.getElementById('expl-treat')
  treat.classList.remove('on')
  document.getElementById('expl-tags').innerHTML = ''
  // Texto da profissional/IA; sem ele, a explicação padrão da condição (ou do músculo)
  const ai = (event.ai_explanation || '').trim()
  const text = ai || cond?.about || (mus ? `${mus.action} ${mus.where}` : 'Esta é a região que estamos avaliando e tratando hoje.')
  const treatText = ai ? '' : (cond?.treatment || mus?.problems || '')
  document.getElementById('expl-treat-t').textContent = cond || !mus ? 'Como o tratamento ajuda' : 'Problemas comuns'
  document.getElementById('expl-treat-text').textContent = treatText
  typewriterEffect(text, document.getElementById('expl-text'), ai ? 24 : 28, () => {
    if (treatText) treat.classList.add('on')
  })
  renderPhyTags(phySharedViewer.getParts())
}

// Estruturas afetadas (as que ficam vermelhas na visão interna)
function renderPhyTags(parts) {
  const box = document.getElementById('expl-tags')
  if (!box || !phySharedViewer) return
  const ids = new Set([...(phySharedViewer._tvFx || []).map(f => f[0]), ...(phySharedViewer._tvMarks || [])])
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const labels = [
    ...(parts || []).filter(p => ids.has(p.id)).map(p => p.label),
    ...(phySharedViewer._tvMuscles || []).map(k => PHY.findMuscle(k)?.name).filter(Boolean)
  ]
  box.innerHTML = [...new Set(labels)].map((l, i) =>
    `<span class="expl-tag" style="animation-delay:${i * 0.08}s"><i></i>${esc(l)}</span>`).join('')
}

// ── Modo Acupuntura 3D ────────────────────────────────────────────────────────

let acuSharedViewer = null
let pendingAcu = null

function showAcupunctureState(event) {
  // Formato: lista de ids (antigo) ou { points, model } — model = corpo escolhido
  let points = [], model = 'female'
  try {
    const v = JSON.parse(event.problem || '[]')
    points = Array.isArray(v) ? v : (v.points || [])
    if (!Array.isArray(v) && v.model === 'male') model = 'male'
  } catch (_) {}

  // Lista vazia = a profissional limpou a TV
  if (!points.length) { showIdle(); return }

  document.body.className = 'bg-default'
  document.getElementById('idle-screen').classList.add('hidden')
  document.getElementById('active-screen').classList.remove('visible')
  document.getElementById('acu-screen').classList.add('visible')
  if (phySharedViewer) { phySharedViewer.destroy(); phySharedViewer = null }

  if (!window.ACU) {                     // módulo 3D ainda carregando
    pendingAcu = event
    setTimeout(() => { if (pendingAcu === event) showAcupunctureState(event) }, 300)
    return
  }
  pendingAcu = null

  // Mesmo corpo que a profissional está usando (masculino ou feminino)
  if (acuSharedViewer && acuSharedViewer.getModel() !== model) {
    acuSharedViewer.destroy()
    acuSharedViewer = null
  }
  if (!acuSharedViewer) {
    acuSharedViewer = new window.ACU.AcupunctureViewer(document.getElementById('acu-canvas-shared'), {
      isDoctor: false,
      tv: true,
      autoRotate: true,
      model
    })
  }
  acuSharedViewer.setSelectedPoints(points, { focus: true })
  _renderAcuInfoPanel(points)
}

function _renderAcuInfoPanel(pointIds) {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const title = document.getElementById('acu-info-title')
  const sub   = document.getElementById('acu-info-sub')
  const tags  = document.getElementById('acu-mer-tags')
  const list  = document.getElementById('acu-pts-list')
  list.innerHTML = ''

  // Agrupa D/E do mesmo ponto numa linha só
  const groups = new Map()
  pointIds.forEach(id => {
    const p = window.ACU.findPoint(id)
    if (!p) return
    if (!groups.has(p.id)) groups.set(p.id, { p, sides: new Set() })
    if (p.side) groups.get(p.id).sides.add(p.side)
  })

  const n = groups.size
  title.textContent = n === 1 ? '1 ponto em tratamento' : `${n} pontos em tratamento`
  sub.textContent = 'Cada ponto fica sobre um meridiano — um canal por onde circula a energia do corpo.'

  const mers = new Map()
  groups.forEach(({ p }) => mers.set(p.meridian.id, p.meridian))
  tags.innerHTML = [...mers.values()].map(m =>
    `<span class="acu-mer-tag"><i style="background:${m.color}"></i>${esc(m.name)}</span>`).join('')

  let idx = 0
  groups.forEach(({ p, sides }) => {
    const lado = !p.pl ? '' : sides.size === 2 ? 'dos dois lados' : sides.has('E') ? 'lado esquerdo' : 'lado direito'
    const code = p.id === p.name ? (p.code || '') : p.id
    const item = document.createElement('div')
    item.className = 'acu-pt-item'
    item.style.setProperty('--c', p.meridian.color)
    item.style.animationDelay = `${idx++ * 0.07}s`
    item.innerHTML = `
      <div class="acu-pt-texts">
        <div class="acu-pt-top">
          <span class="acu-pt-code">${esc(code)}</span>
          <span class="acu-pt-pinyin">${esc(p.name)}</span>
          ${lado ? `<span class="acu-pt-side">· ${lado}</span>` : ''}
        </div>
        <div class="acu-pt-name-pt">"${esc(p.pt)}" · ${esc(p.meridian.name)}</div>
        <div class="acu-pt-ind">${esc(p.ind.replace(/\.?\s*Evitar na gestação\.?/i, ''))}</div>
      </div>`
    list.appendChild(item)
  })
}

// ── Início ──────────────────────────────────────────────────────────────────
startSharedStream()

</script>
